# Local profile: file-backed H2 so the API runs without Docker/Postgres.
spring:
  datasource:
    url: jdbc:h2:file:./data/shofe;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

shofe:
  fare:
    currency: USD
  night-owl:
    zone: Africa/Harare
  payments:
    default-country: ZW
