# In-memory H2 so the API can boot on Vercel without a managed Postgres.
spring:
  datasource:
    url: jdbc:h2:mem:shofe;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

shofe:
  uploads-dir: /tmp/shofe-uploads
  pesepay:
    result-url: ${PESEPAY_RESULT_URL:https://shofe-api.vercel.app/api/payments/pesepay/result}
    return-url: ${PESEPAY_RETURN_URL:https://shofe-delta.vercel.app/activity}
    sandbox: ${PESEPAY_SANDBOX:true}
