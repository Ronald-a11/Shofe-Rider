server:
  port: ${PORT:8080}

spring:
  application:
    name: shofe
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shofe}
    username: ${SPRING_DATASOURCE_USERNAME:shofe}
    password: ${SPRING_DATASOURCE_PASSWORD:shofe}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 24MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

shofe:
  jwt:
    secret: ${JWT_SECRET:shofe-dev-secret-change-in-production-32b!}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  fare:
    currency: USD
    base: 2
    per-km: 0.8
    night-owl-multiplier: 1.15
    minimum: 2.5
  matching:
    radius-km: 80
    night-owl-min-rating: 4.6
    request-ttl-minutes: 10
  night-owl:
    zone: Africa/Harare
    start-hour: 22
    end-hour: 5
  commission:
    percent: ${SHOFE_COMMISSION_PERCENT:12}
    min-wallet: ${SHOFE_MIN_WALLET:5}
  payments:
    default-country: ${SHOFE_DEFAULT_COUNTRY:ZW}
  pesepay:
    integration-key: ${PESEPAY_INTEGRATION_KEY:}
    encryption-key: ${PESEPAY_ENCRYPTION_KEY:}
    result-url: ${PESEPAY_RESULT_URL:http://localhost:8080/api/payments/pesepay/result}
    return-url: ${PESEPAY_RETURN_URL:http://localhost:5173/activity}
    demo: ${PESEPAY_DEMO:true}
  safety:
    fatigue-hours: ${SHOFE_FATIGUE_HOURS:10}
    route-deviation-km: ${SHOFE_ROUTE_DEVIATION_KM:1.5}
  bootstrap:
    admin-email: ${SHOFE_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${SHOFE_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-phone: ${SHOFE_BOOTSTRAP_ADMIN_PHONE:+263771000001}
  otp:
    ttl-seconds: ${SHOFE_OTP_TTL:300}
    resend-seconds: ${SHOFE_OTP_RESEND:45}
    max-sends: ${SHOFE_OTP_MAX_SENDS:5}
    max-attempts: ${SHOFE_OTP_MAX_ATTEMPTS:5}
    echo: ${SHOFE_OTP_ECHO:false}
  sms:
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from: ${TWILIO_FROM:}
    africastalking:
      username: ${AT_USERNAME:}
      api-key: ${AT_API_KEY:}
      from: ${AT_FROM:}
  dev-tools: ${SHOFE_DEV_TOOLS:false}
  uploads-dir: ${SHOFE_UPLOADS:uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
